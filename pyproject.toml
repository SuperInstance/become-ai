[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "become-ai"
version = "0.1.0"
description = "The transformation protocol — how agents evolve identity and capabilities over time"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Superinstance", email = "dev@lucineer.com" },
]
keywords = ["ai", "agents", "transformation", "evolution", "identity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/become-ai"
Repository = "https://github.com/SuperInstance/become-ai"

[tool.setuptools.packages.find]
include = ["become_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
